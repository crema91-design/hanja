<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>필수한자 1800</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f3ee">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;--card:#fffdf9;--ink:#1f1b16;--sub:#6f665b;--line:#e4ddd2;
  --accent:#9a3b2e;--accent-soft:#f3e3df;--good:#2f6b4f;--good-soft:#e1efe7;--bad:#a8402f;--bad-soft:#f6e1dc;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161412;--card:#211e1b;--ink:#f1ebe3;--sub:#a59b8f;--line:#35302b;
  --accent:#e08a75;--accent-soft:#3a2622;--good:#7cc3a0;--good-soft:#1f3329;--bad:#ec8f7c;--bad-soft:#3b2420;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
body{min-height:100dvh}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 96px}
.hz{font-family:'Noto Serif KR','Apple SD Gothic Neo',serif}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.3px}
header h1 span{color:var(--accent)}
.muted{color:var(--sub);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.label{font-size:12px;color:var(--sub);margin:0 0 8px;font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat small{color:var(--sub);font-size:12px}
.big{display:block;width:100%;padding:15px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;background:var(--accent);color:#fff;margin-top:4px}
.big.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:8px}
.row>*{flex:1}
/* card */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:0;background:none;color:var(--ink);font-size:22px;padding:4px 8px 4px 0}
.top .prog{flex:1}
.top .prog .bar{margin-top:0}
.cnt{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.flash{background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:min(62dvh,460px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;user-select:none;position:relative}
.flash .char{font-size:clamp(120px,40vw,180px);line-height:1.1;font-weight:500}
.flash .hint{position:absolute;bottom:16px;color:var(--sub);font-size:13px}
.flash .ans{margin-top:14px;min-height:96px}
.flash .ans .m{font-size:26px;font-weight:700;line-height:1.35;word-break:keep-all}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--sub)}
.chip.k{background:var(--good-soft);color:var(--good);border-color:transparent}
.hidden{visibility:hidden}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;padding:17px 10px;border-radius:14px;border:0;font:inherit;font-size:16px;font-weight:700}
.no{background:var(--bad-soft);color:var(--bad)}
.yes{background:var(--good-soft);color:var(--good)}
.reveal{background:var(--ink);color:var(--bg)}
/* quiz */
.opts{display:grid;gap:10px;margin-top:14px}
.opts button{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;text-align:left;font-weight:500}
.opts button.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qchar{font-size:clamp(110px,36vw,160px);line-height:1.1;text-align:center}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 16px}
/* list */
.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:12px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;position:relative}
.cell .c{font-size:30px;line-height:1.2}
.cell .s{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.known{border-color:var(--good)}
.cell.known::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.cell.weak::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));text-align:center}
.sheet .char{font-size:110px;line-height:1.15}
.sheet .m{font-size:22px;font-weight:700;margin-top:6px}
.done{text-align:center;padding:30px 10px}
.done .emoji{font-size:44px}
.done h2{margin:8px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs div{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;font-family:'Noto Serif KR',serif;line-height:1.2}
nav.tabs button.on{color:var(--accent);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:4px 0}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.danger{color:var(--bad);background:none;border:0;font:inherit;font-size:13px;padding:8px 0;text-decoration:underline}
.cfm{display:none;gap:8px;margin-top:6px}
.cfm.open{display:flex}
.cfm button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.cfm button.d{background:var(--bad);color:#fff;border:0}
.foot{font-size:11px;color:var(--sub);margin-top:16px;line-height:1.6}
.due{background:var(--accent-soft);border-color:transparent}
.due h2{margin:0;font-size:17px}
.due .num{font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.sched{display:flex;gap:4px;align-items:flex-end;height:70px;margin-top:12px}
.sched div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.sched i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 2px 2px;opacity:.85;min-height:2px}
.sched span{font-size:10px;color:var(--sub);white-space:nowrap}
.sched b{font-size:10px;font-weight:500;color:var(--sub)}
.stages{display:flex;gap:3px;margin-top:10px}
.stages i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stages i.on{background:var(--good)}
.cell.lv-hi{border-color:var(--good)}
.cell.lv-hi::after,.cell.lv-lo::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.cell.lv-lo::after{background:#d9a441}
.cell.lv-0::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.tapchar{cursor:pointer;border-bottom:2px dotted var(--accent);padding:0 6px}
.why{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:500}
.ety{text-align:left;margin-top:14px}
.ety .type{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ety .type b{background:var(--accent);color:#fff;border-radius:8px;padding:3px 10px;font-size:13px}
.ety .type span{font-size:12px;color:var(--sub)}
.ety .desc{font-size:16px;line-height:1.65;word-break:keep-all}
.parts{display:flex;align-items:stretch;gap:8px}
.part{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:var(--bg)}
.part .r{font-size:11px;color:var(--sub);font-weight:500}
.part .pc{font-size:40px;line-height:1.25}
.part .pn{font-size:13px;font-weight:500}
.part .pr{font-size:12px;margin-top:4px;color:var(--accent);word-break:keep-all}
.plus{align-self:center;color:var(--sub);font-size:20px}
.sound{margin-top:10px;font-size:14px;line-height:1.6;background:var(--bg);border-radius:12px;padding:10px 12px;word-break:keep-all}
.fam{margin-top:12px}
.fam .fl{font-size:12px;color:var(--sub);margin-bottom:6px}
.fam .fc{display:flex;flex-wrap:wrap;gap:6px}
.fam button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:5px 9px;font:inherit;font-size:13px}
.fam button .hz{font-size:20px;margin-right:3px;vertical-align:-2px}
.etynote{font-size:11px;color:var(--sub);margin-top:12px;text-align:left}
.sheet{max-height:88dvh;overflow-y:auto}
.ex{margin-top:14px;text-align:left}
.ex .fl{font-size:12px;color:var(--sub);margin-bottom:6px}
.ex .w{display:flex;align-items:baseline;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.ex .w:first-of-type{border-top:0}
.ex .wh{font-size:24px;white-space:nowrap}
.ex .wh i{font-style:normal;color:var(--accent)}
.ex .wh span{cursor:pointer}
.ex .wr{font-weight:700;font-size:15px;white-space:nowrap}
.ex .wb{font-size:12px;color:var(--sub);margin-left:auto;text-align:right;word-break:keep-all}
.mini{margin-top:12px;font-size:15px;color:var(--sub)}
.mini b{font-family:'Noto Serif KR',serif;color:var(--ink);font-weight:500;font-size:18px}
.bk{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:12px monospace;padding:8px;margin-top:8px}
.bkrow{display:flex;gap:8px;margin-top:8px}
.bkrow button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px;background:var(--c)}
</style>
</head>

/* 에빙하우스 망각 곡선 간격 반복
   단계 0: 틀림/모름 → 10분 뒤 다시
   단계 1~7: 1일 → 2일 → 4일 → 7일 → 15일 → 30일 → 60일 뒤 복습
   맞히면 다음 단계, 틀리면 단계 0으로 돌아감. 7단계를 통과하면 '장기기억'. */
const DAYS=[0,1,2,4,7,15,30,60];
const MAXS=DAYS.length-1;
const MIN=60*1000, DAY=86400000;
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function schedule(stage,now){return stage===0? now+10*MIN : dayStart(now)+DAYS[stage]*DAY;}

const KEY='hanja1800.v1';
let S={sr:{},range:'mid',order:'seq',mode:'card',cursor:{},dailyNew:20};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(S,s);}catch(e){}
// 이전 버전 기록 옮기기
(function migrate(){
  const now=Date.now();
  if(S.known){for(const h in S.known) if(!S.sr[h]) S.sr[h]={s:1,d:schedule(1,now),n:1,l:0}; delete S.known;}
  if(S.weak){for(const h in S.weak) S.sr[h]={s:0,d:now,n:1,l:S.weak[h]}; delete S.weak;}
  if(S.range==='weak') S.range='mid';
  delete S.onlyNew;
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function backupJSON(){return JSON.stringify({v:1,at:Date.now(),sr:S.sr});}
function downloadBackup(){
  try{const b=new Blob([backupJSON()],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`한자기록_${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);S.lastBk=today();save();return true;}catch(e){return false;}
}
function mergeBackup(txt){
  const o=JSON.parse(String(txt).trim()); if(!o||typeof o.sr!=='object') throw 0;
  let n=0;for(const h in o.sr){const a=o.sr[h],b=S.sr[h];if(BY[h]&&a&&typeof a.s==='number'&&(!b||(a.n||0)>(b.n||0))){S.sr[h]=a;n++;}}
  save(); return n;
}
function pickBackupFile(cb){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';
  i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{cb(null,mergeBackup(t));}catch(e){cb(e);}});};i.click();
}

  if(ok){ r.s = wasNew? 1 : Math.min(r.s+1,MAXS); }
  else{ r.s=0; r.l=(r.l||0)+1; }
  r.d=schedule(r.s,now); r.n=(r.n||0)+1;
  S.sr[x.h]=r; save();
}
function pool(range){
  if(range==='mid') return H.filter(x=>x.lv===0);
  if(range==='high') return H.filter(x=>x.lv===1);
  return H;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDue(t){
  const now=Date.now(); if(t<=now) return '지금';
  const dd=Math.round((dayStart(t)-dayStart(now))/DAY);
  if(dd===0){const m=Math.ceil((t-now)/MIN); return m<60?`${m}분 뒤`:`오늘`;}
  if(dd===1) return '내일'; const d=new Date(t); return `${dd}일 뒤 (${d.getMonth()+1}/${d.getDate()})`;
}
function stageName(r){ if(!r) return '아직 안 배움'; if(r.s===0) return '다시 외우는 중'; if(r.s===MAXS) return '장기기억 (7단계)'; return `${r.s}단계 / 7`; }

function startDue(){
  const list=dueList();
  if(!list.length) return renderHome();
  session={kind:'due',list:shuffleWithin(list),pos:0,mode:S.mode,right:0,wrong:0,revealed:false,done:new Set(),requeued:{}};
  render();
}
function shuffleWithin(list){ // 같은 단계 안에서는 섞기
  const g={}; list.forEach(x=>(g[S.sr[x.h].s]??=[]).push(x));
  return Object.keys(g).sort((a,b)=>a-b).flatMap(k=>shuffle(g[k]));
}
function startNew(){
  let p=pool(S.range).filter(x=>!S.sr[x.h]);
  if(!p.length){ app.innerHTML=doneHTML('이 범위는 모두 배웠어요!','다른 범위를 고르거나, 복습으로 장기기억을 만들어 보세요.'); bindDone(); return; }
  if(S.order==='rand') p=shuffle(p);
  session={kind:'new',list:p.slice(0,S.dailyNew),pos:0,mode:S.mode,right:0,wrong:0,revealed:false,requeued:{}};
  render();
}

/* ---------- 공통 ---------- */
function topBar(){
  const {pos,list,kind}=session;
  return `<div class="top"><button class="back" id="back">‹</button>
  <div class="prog"><div class="muted" style="font-size:11px;margin-bottom:4px">${kind==='due'?'복습':'새 한자'}</div><div class="bar"><i style="width:${pos/list.length*100}%"></i></div></div>
  <span class="cnt">${pos+1} / ${list.length}</span></div>`;
}
function chips(x){
  const r=rec(x.h);
  return `<span class="chip">${x.lv?'고교용':'중학용'}</span><span class="chip">${esc(x.g)}</span><span class="chip">부수 <span class="hz">${esc(x.k)}</span></span><span class="chip">${x.t}획</span>${r&&r.s>0?`<span class="chip k">${r.s}단계</span>`:''}`;
}
function grade(ok){
  const x=session.list[session.pos];
  // 이번 학습에서 처음 답한 결과만 일정에 반영, 틀린 한자는 이번 학습 끝에 한 번 더
  if(!session.requeued[x.h]) answer(x,ok);
  else if(ok){ /* 다시 맞힘: 단계 0 → 10분 뒤 일정 유지 */ }
  if(ok) session.right++; else {
    session.wrong++;
    if((session.requeued[x.h]||0)<2){ session.requeued[x.h]=(session.requeued[x.h]||0)+1; session.list.push(x); }
  }
}
function next(){
  const x=session.list[session.pos];
  if(session.kind==='new' && S.order==='seq') S.cursor[S.range]=x.i+1;
  save();
  session.pos++; session.revealed=false; session.opts=null; session.answered=false; session.picked=null;
  if(session.pos>=session.list.length) return finish();
  render();
}

/* ---------- CARD ---------- */
function renderCard(){
  const x=session.list[session.pos], r=session.revealed;
  app.innerHTML=topBar()+`
  <div class="flash" id="flash">
    <div class="char hz ${r?'tapchar':''}" id="bigc">${x.h}</div>
    <div class="ans ${r?'':'hidden'}"><div class="m">${esc(x.m)}</div><div class="chips">${chips(x)}</div>${miniWords(x)}
    <button class="why" id="why">왜 이런 뜻·음일까? 한자를 눌러 보세요</button></div>
    ${r?'':'<div class="hint">떠올려 본 뒤 카드를 누르세요</div>'}
  </div>
  <div class="actions">${r?
    `<button class="no" id="no">몰랐어요</button><button class="yes" id="yes">알았어요</button>`:
    `<button class="reveal" id="rev">뜻 보기</button>`}</div>`;
  $('#back').onclick=goHome;
  const rev=()=>{session.revealed=true;renderCard();};
  if(!r){$('#flash').onclick=rev;$('#rev').onclick=rev;}
  else{ $('#no').onclick=()=>{grade(false);next();}; $('#yes').onclick=()=>{grade(true);next();};
    $('#bigc').onclick=$('#why').onclick=()=>openEty(x); }
}

/* ---------- QUIZ ---------- */
function renderQuiz(){
  const x=session.list[session.pos];
  if(!session.opts){
    const others=shuffle(H.filter(y=>y.h!==x.h && y.m!==x.m && y.lv===x.lv)).slice(0,3);
    session.opts=shuffle([x,...others]);
  }
  app.innerHTML=topBar()+`
  <div class="qbox" style="text-align:center"><div class="qchar hz"><span id="qc" class="${session.answered?'tapchar':''}">${x.h}</span></div>
  <div class="chips ${session.answered?'':'hidden'}">${chips(x)}</div>
  ${session.answered?miniWords(x):''}
  ${session.answered?'<button class="why" id="why">왜 이런 뜻·음일까? 한자를 눌러 보세요</button>':''}</div>
  <div class="opts">${session.opts.map((o,i)=>`<button data-i="${i}">${esc(o.m)}</button>`).join('')}</div>
  ${session.answered?'<button class="big" id="next" style="margin-top:12px">다음</button>':''}`;
  $('#back').onclick=goHome;
  const btns=app.querySelectorAll('.opts button');
  if(session.answered){
    btns.forEach((b,i)=>{const o=session.opts[i]; if(o===x) b.classList.add('right'); else if(i===session.picked) b.classList.add('wrong');});
    $('#next').onclick=next;
    $('#qc').onclick=$('#why').onclick=()=>openEty(x);
  } else btns.forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=session.opts[i]===x;
    session.answered=true; session.picked=i; grade(ok); renderQuiz();
  });
}

/* ---------- DONE ---------- */
function doneHTML(t,sub){return `<div class="panel done"><div class="emoji hz">善</div><h2>${t}</h2><p class="muted">${sub}</p>
<div class="row" style="margin-top:16px"><button class="big ghost" id="home2">처음으로</button><button class="big" id="again">${dueList().length?'남은 복습 하기':'새 한자 더 배우기'}</button></div></div>`;}
function bindDone(){ $('#home2').onclick=goHome; $('#again').onclick=()=>dueList().length?startDue():startNew(); }
function finish(){
  const {right,wrong,kind,list}=session;
  const uniq=new Set(list.map(x=>x.h)).size;
  const lapsed=Object.keys(session.requeued).length;
  session=null;
  const autoBk = S.lastBk!==today() && Object.keys(S.sr).length && downloadBackup();
  const sub=`${uniq}자 ${kind==='due'?'복습':'학습'} 완료 · 틀린 한자 ${lapsed}자<br>`+
    (lapsed?'틀린 한자는 10분 뒤부터 다시 복습에 나와요.<br>':'')+
    '맞힌 한자는 망각 곡선 간격에 맞춰 다음 복습이 잡혔어요.'+(autoBk?'<br>오늘 기록을 백업 파일로 다운로드 폴더에 저장했어요.':'');
  app.innerHTML=doneHTML('수고했어요!',sub);
  bindDone();
}
function render(){ if(!session) return renderHome(); session.mode==='quiz'?renderQuiz():renderCard(); window.scrollTo(0,0); }
function goHome(){session=null;tab='home';setTab();renderHome();}

/* ---------- LIST ---------- */
let q='', lf='all';
function lvClass(h){const r=rec(h); if(!r) return ''; if(r.s===0) return 'lv-0'; return r.s>=5?'lv-hi':'lv-lo';}
function renderList(){
  app.innerHTML=`<header><h1>찾아보기</h1><span class="muted" id="lc"></span></header>
  <input class="search" id="q" placeholder="음·뜻·한자로 검색 (예: 가, 물, 水)" value="${esc(q)}">
  <div class="seg" style="margin-top:10px" id="lf">
    ${[['all','전체'],['mid','중학'],['high','고교'],['learn','배운 한자'],['new','안 배움'],['due','복습 대기'],['lapse','자주 틀림']].map(([v,t])=>`<button data-v="${v}" class="${lf===v?'on':''}">${t}</button>`).join('')}
  </div>
  <div class="legend"><span style="--c:var(--bad)">다시 외우는 중</span><span style="--c:#d9a441">1~4단계</span><span style="--c:var(--good)">5단계 이상</span></div>
  <div class="grid" id="grid"></div>`;
  $('#q').oninput=e=>{q=e.target.value.trim();drawGrid();};
  app.querySelectorAll('#lf button').forEach(b=>b.onclick=()=>{lf=b.dataset.v;renderList();});
  drawGrid();
}
function drawGrid(){
  let p=H; const now=Date.now();
  if(lf==='mid') p=p.filter(x=>x.lv===0); else if(lf==='high') p=p.filter(x=>x.lv===1);
  else if(lf==='learn') p=p.filter(x=>S.sr[x.h]); else if(lf==='new') p=p.filter(x=>!S.sr[x.h]);
  else if(lf==='due') p=p.filter(x=>isDue(x.h,now));
  else if(lf==='lapse') p=p.filter(x=>S.sr[x.h]&&S.sr[x.h].l>0).sort((a,b)=>S.sr[b.h].l-S.sr[a.h].l);
  if(q) p=p.filter(x=>x.h===q||x.m.includes(q));
  $('#lc').textContent=p.length+'자';
  $('#grid').innerHTML=p.map(x=>`<div class="cell ${lvClass(x.h)}" data-i="${x.i}"><div class="c hz">${x.h}</div><div class="s">${esc(x.m.split(' / ')[0])}</div></div>`).join('');
  $('#grid').onclick=e=>{const c=e.target.closest('.cell'); if(c) openSheet(H[+c.dataset.i]);};
}
function openSheet(x){
  const sh=$('#sheet');
  const draw=()=>{const r=rec(x.h);
  sh.innerHTML=`<div class="char hz">${x.h}</div><div class="m">${esc(x.m)}</div><div class="chips">${chips(x)}</div>
  <div class="stages">${DAYS.slice(1).map((_,i)=>`<i class="${r&&r.s>i?'on':''}"></i>`).join('')}</div>
  <p class="muted" style="margin:8px 0 0">${stageName(r)}${r?` · 다음 복습 ${fmtDue(r.d)}${r.l?` · ${r.l}번 틀림`:''}`:''}</p>
  ${wordsHTML(x)}${etyHTML(x)}
  <div class="row" style="margin-top:16px"><button class="big ghost" id="sClose">닫기</button><button class="big" id="sTog">${r?'처음부터 다시 외우기':'지금 복습 목록에 넣기'}</button></div>`;
  $('#sClose').onclick=closeSheet; bindFam();
  $('#sTog').onclick=()=>{ const o=S.sr[x.h]||{n:0,l:0}; S.sr[x.h]={...o,s:0,d:Date.now()}; save(); draw(); drawGrid(); };};
  draw(); $('#sheetBg').classList.add('open');
}
const TYPEINFO={
  '상형':'사물의 모양을 그대로 본뜬 글자',
  '지사':'점·선 같은 기호로 생각을 나타낸 글자',
  '회의':'뜻을 가진 글자 둘 이상을 합쳐 새 뜻을 만든 글자',
  '형성':'뜻을 나타내는 부분 + 소리를 나타내는 부분을 합친 글자',
  '회의·형성':'뜻을 합친 글자인데, 한 부분이 소리도 함께 나타내는 글자'};
function jo(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+a;return w+((c-0xAC00)%28?a:b);}
function hunOf(n){n=n.replace(/\(.*?\)/g,'').trim();const p=n.split(' ');return p.length>1?p.slice(0,-1).join(' '):n;}
function hzify(t){return esc(t).replace(/([\u2E80-\u2FDF\u3400-\u9FFF\uF900-\uFAFF\u{20000}-\u{3FFFF}])/gu,'<span class="hz">$1</span>');}
function miniWords(x){
  if(!x.w||!x.w.length) return '';
  return `<div class="mini">${x.w.slice(0,2).map(([w,r])=>`<b>${w}</b> ${esc(r)}`).join(' &nbsp;·&nbsp; ')}</div>`;
}
function wordsHTML(x){
  if(!x.w||!x.w.length) return '';
  return `<div class="ex"><div class="fl">예시 단어 · 한자를 누르면 그 한자 풀이로 가요</div>${x.w.map(([w,r,b])=>`<div class="w">
    <div class="wh hz">${[...w].map(c=>c===x.h?`<i>${c}</i>`:(BY[c]?`<span data-c="${c}">${c}</span>`:c)).join('')}</div>
    <div class="wr">${esc(r)}</div><div class="wb">${esc(b)}</div></div>`).join('')}</div>`;
}
function etyHTML(x){
  const e=x.e||{}; if(!e.t) return '';
  const eum=x.m.split(' / ')[0].split(' ').pop(), hun=hunOf(x.m.split(' / ')[0]);
  let body='';
  if(e.s){
    const [sc,sn]=e.s,[pc,pn,pe]=e.p;
    const same=pe===eum;
    body=`<div class="parts">
      <div class="part"><div class="r">뜻 부분</div><div class="pc hz">${sc}</div><div class="pn">${esc(sn)}</div><div class="pr">‘${esc(hunOf(sn))}’${jo('','','')}${esc(jo(hunOf(sn),'과','와').slice(-1))} 관련된 뜻</div></div>
      <div class="plus">+</div>
      <div class="part"><div class="r">소리 부분</div><div class="pc hz">${pc}</div><div class="pn">${esc(pn)}</div><div class="pr">음 [${esc(pe)}]${esc(jo(pe,'을','를').slice(-1))} 빌려 줌</div></div>
    </div>
    <div class="sound">${hzify(sc)} <b>${esc(hunOf(sn))}</b>에 관한 뜻 → <b>${esc(hun)}</b><br>
    ${hzify(pc)}의 소리 [${esc(pe)}] → <span class="hz">${x.h}</span> [${esc(eum)}] ${same?'· 소리가 그대로예요':'· 소리가 조금 변했어요'}</div>`;
    if(e.f&&e.f.length) body+=`<div class="fam"><div class="fl">소리 부분 <span class="hz">${pc}</span>을(를) 가진 다른 필수한자 — 음이 비슷해요</div><div class="fc">${
      e.f.map(c=>{const y=BY[c];return `<button data-c="${c}"><span class="hz">${c}</span>${esc(y.m.split(' / ')[0])}</button>`}).join('')}</div></div>`;
  } else body=`<div class="desc">${hzify(e.d)}</div>`;
  return `<div class="ety"><div class="type"><b>${esc(e.t)}</b><span>${TYPEINFO[e.t]||''}</span></div>${body}
  <div class="etynote">자원(字源) 풀이는 학설이 여럿이에요. 외우기 위한 길잡이로 봐 주세요.</div></div>`;
}
function bindFam(){ $('#sheet').querySelectorAll('.fam button, .ex span[data-c]').forEach(b=>b.onclick=()=>openEty(BY[b.dataset.c])); }
function openEty(x){
  const sh=$('#sheet');
  sh.innerHTML=`<div class="char hz">${x.h}</div><div class="m">${esc(x.m)}</div>${wordsHTML(x)}${etyHTML(x)}
  <button class="big ghost" id="sClose" style="margin-top:16px">닫기</button>`;
  $('#sClose').onclick=closeSheet; bindFam(); sh.scrollTop=0;
  $('#sheetBg').classList.add('open');
}
function closeSheet(){$('#sheetBg').classList.remove('open');}
$('#sheetBg').onclick=e=>{if(e.target.id==='sheetBg') closeSheet();};

/* ---------- TABS ---------- */
function setTab(){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;session=null;setTab();tab==='home'?renderHome():renderList();window.scrollTo(0,0);});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !session && tab==='home') renderHome(); });
renderHome();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
